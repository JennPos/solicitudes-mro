<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Solicitud de material — MRO</title>
<script src="https://purchasing.rubber-mexico.com/app-switcher.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- La version evita que el navegador se quede con un config.js viejo:
     es justo el archivo que se edita para reconfigurar, y sin esto un
     cambio puede tardar horas en verse. Subirla al editarlo. -->
<script src="config.js?v=2"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
:root{
  color-scheme:light;
  --ink:#1a2233; --ink-2:#42506b; --muted:#71809b; --faint:#9aa6bd;
  --surface:#ffffff; --surface-2:#f6f8fc; --bg:#eef1f8; --chrome:#1e2a4a;
  --line:#e4e9f2; --line-2:#cfd7e6;
  /* acento cobalto, más vivo que el azul de plano anterior */
  --brand:#3457d5; --brand-2:#2743b4; --brand-tint:#ecf0fe; --brand-line:#c5d1fa;
  /* paleta categórica: una por gráfica y por familia del catálogo */
  --c1:#3457d5; --c2:#7048c8; --c3:#0e9aa7; --c4:#e08a1e;
  --c5:#d6456e; --c6:#2f9e5f; --c7:#e2643a; --c8:#4a8fd4;
  --c1b:#eaeefc; --c2b:#f2ecfb; --c3b:#e5f5f6; --c4b:#fdf3e4;
  --c5b:#fceaef; --c6b:#e9f6ee; --c7b:#fdefe9; --c8b:#ecf3fc;
  --ok:#16a34a; --ok-bg:#e8f8ee; --ok-line:#b7e6c8;
  --warn:#d17d06; --warn-bg:#fef4e4; --warn-line:#f6ddb0;
  --crit:#dc2626; --crit-bg:#fdedec; --crit-line:#f8c9c6;
  --sans:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
*{box-sizing:border-box;} html,body{margin:0;padding:0;}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);min-height:100vh;
  font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

/* ---------- barra superior ---------- */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  background:var(--chrome);padding:0 24px;height:60px;}
.hdr .brand{display:flex;align-items:center;gap:12px;}
.hdr .logo{width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
  letter-spacing:.04em;flex:none;box-shadow:0 2px 8px rgba(52,87,213,.4);}
.hdr .t{font-weight:700;font-size:15.5px;color:#fff;letter-spacing:-.01em;line-height:1.3;}
.hdr .s{font-size:11.5px;color:#93a1c4;letter-spacing:.02em;}
.hdr-r{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.hdr .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.16);color:#eef2fb;
  height:32px;font-weight:600;border-radius:8px;}
.hdr .btn:hover{background:rgba(255,255,255,.19);border-color:rgba(255,255,255,.28);color:#fff;}
.conn{font-size:11.5px;color:#93a1c4;display:inline-flex;align-items:center;gap:6px;}
.conn::before{content:"";width:7px;height:7px;border-radius:50%;background:#5c6b8f;}
.conn.on::before{background:#38d38a;box-shadow:0 0 0 3px rgba(56,211,138,.2);}

/* ---------- navegación ---------- */
.wrap{max-width:1400px;margin:0 auto;padding:0 24px 64px;}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 -24px 22px;padding:0 24px;
  background:var(--surface);border-bottom:1px solid var(--line);}
.tab{background:none;border:none;border-bottom:2.5px solid transparent;color:var(--muted);
  padding:14px 14px 11px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;gap:8px;margin-bottom:-1px;transition:.14s;}
.tab:hover{color:var(--ink);}
.tab.active{color:var(--brand);border-bottom-color:var(--brand);}
.tab .bdg{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;
  padding:0 6px;background:var(--crit);color:#fff;border-radius:999px;font-size:11px;font-weight:700;}

/* ---------- superficies ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 22px;margin-bottom:18px;box-shadow:0 1px 2px rgba(26,34,51,.04);}
.sec-t{font-size:16px;font-weight:700;color:var(--ink);margin:0 0 15px;letter-spacing:-.01em;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.sec-t small{font-weight:500;font-size:13px;color:var(--muted);}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 15px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:8px;
  font-weight:600;font-size:13.5px;font-family:inherit;cursor:pointer;white-space:nowrap;transition:.14s;}
.btn:hover{background:var(--surface-2);border-color:#b9c4da;color:var(--ink);}
.btn:disabled{opacity:.42;cursor:default;}
.btn:disabled:hover{background:var(--surface);border-color:var(--line-2);}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 1px 3px rgba(52,87,213,.3);}
.btn-primary:hover{background:var(--brand-2);border-color:var(--brand-2);color:#fff;}
.btn-primary:disabled:hover{background:var(--brand);border-color:var(--brand);}
.btn-danger{background:var(--crit-bg);border-color:var(--crit-line);color:var(--crit);}
.btn-danger:hover{background:#fbdedb;border-color:var(--crit);color:var(--crit);}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 1px 3px rgba(22,163,74,.28);}
.btn-ok:hover{background:#128040;border-color:#128040;color:#fff;}
.btn-sm{height:29px;padding:0 11px;font-size:12.5px;border-radius:7px;}
.btn-icon{width:29px;padding:0;font-size:15px;font-weight:700;}

/* ---------- tablas ---------- */
table.tbl{width:100%;border-collapse:collapse;font-size:14px;}
table.tbl th{text-align:left;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.01em;
  padding:0 12px 9px;border-bottom:1px solid var(--line-2);white-space:nowrap;}
table.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink-2);}
table.tbl tbody tr:hover td{background:var(--surface-2);}
table.tbl tr:last-child td{border-bottom:none;}
table.tbl td.num,table.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;}
.mono{font-family:var(--mono);font-size:13px;}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -22px;padding:0 22px;}
.row-click{cursor:pointer;}

/* ---------- estados ---------- */
.pill{display:inline-flex;align-items:center;padding:3px 11px;border-radius:999px;font-size:12px;
  font-weight:600;white-space:nowrap;border:1px solid transparent;}
.pill-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line);}
.pill-pend{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line);}
.pill-run{background:var(--brand-tint);color:var(--brand);border-color:var(--brand-line);}
.pill-block{background:var(--crit-bg);color:var(--crit);border-color:var(--crit-line);}
.pill-maq{background:var(--c3b);color:var(--c3);border-color:#bce4e7;font-family:var(--mono);font-size:11.5px;}
.pill-mute{background:var(--surface-2);color:var(--muted);border-color:var(--line-2);font-weight:500;}

/* ---------- formularios ---------- */
.form-control{width:100%;height:38px;padding:0 12px;border:1px solid var(--line-2);border-radius:8px;
  background:var(--surface);color:var(--ink);font-size:14px;font-family:inherit;transition:.14s;}
.form-control:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3.5px rgba(52,87,213,.15);}
textarea.form-control{height:auto;min-height:66px;padding:10px 12px;resize:vertical;line-height:1.55;}
select.form-control{cursor:pointer;}
.lbl{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-bottom:6px;}
.field{margin-bottom:15px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;}
.chk{width:16px;height:16px;accent-color:#3457d5;cursor:pointer;}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:15px;}
.toolbar .grow{flex:1;min-width:220px;}
.muted{color:var(--muted);}
.empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:14px;}

/* ---------- segmentado ---------- */
.seg{display:inline-flex;gap:3px;padding:3px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:9px;}
.seg button{border:none;background:transparent;color:var(--muted);font-weight:600;font-size:13px;
  height:30px;padding:0 13px;cursor:pointer;font-family:inherit;white-space:nowrap;border-radius:7px;transition:.14s;}
.seg button:hover{background:#fff;color:var(--ink);}
.seg button.active{background:var(--brand);color:#fff;box-shadow:0 1px 3px rgba(52,87,213,.32);}
.seg.on-dark{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.14);}
.seg.on-dark button{color:#b9c5e0;}
.seg.on-dark button:hover{background:rgba(255,255,255,.12);color:#fff;}
.seg.on-dark button.active{background:#fff;color:var(--chrome);}

/* ---------- indicadores ---------- */
.kpis{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:18px;}
.kpi{flex:1;min-width:172px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 18px;box-shadow:0 1px 2px rgba(26,34,51,.04);position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand);}
.kpi.warn::before{background:var(--warn);} .kpi.bad::before{background:var(--crit);}
.kpi.good::before{background:var(--ok);} .kpi.calm::before{background:var(--line-2);}
.kpi .n{font-size:29px;font-weight:700;color:var(--ink);line-height:1.05;font-variant-numeric:tabular-nums;
  letter-spacing:-.025em;}
.kpi.warn .n{color:var(--warn);} .kpi.bad .n{color:var(--crit);} .kpi.good .n{color:var(--ok);}
.kpi .l{font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:8px;}
.kpi .d{font-size:12px;color:var(--faint);margin-top:2px;}
.kpi.click{cursor:pointer;transition:.14s;}
.kpi.click:hover{border-color:var(--brand-line);box-shadow:0 3px 10px rgba(52,87,213,.1);}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;}
.tile{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:14px 16px;}
.tile .tv{font-size:22px;font-weight:700;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;}
.tile .tl{font-size:12px;color:var(--muted);font-weight:500;margin-top:7px;}

/* ---------- stock ---------- */
.stk{display:flex;align-items:center;gap:10px;justify-content:flex-end;}
.stk .v{font-family:var(--mono);font-weight:500;font-size:13.5px;color:var(--ink);min-width:46px;
  text-align:right;font-variant-numeric:tabular-nums;}
.stk .v.low{color:var(--warn);} .stk .v.zero{color:var(--crit);}
.sbar{position:relative;width:72px;height:6px;background:var(--line);border-radius:999px;}
.sbar i{display:block;height:100%;border-radius:999px;background:var(--brand);}
.sbar .mk{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink-2);opacity:.45;border-radius:2px;}

/* ---------- avisos ---------- */
.hint{background:var(--brand-tint);border:1px solid var(--brand-line);color:#2743b4;
  padding:12px 15px;border-radius:9px;font-size:13.5px;margin-bottom:15px;line-height:1.55;}
.hint.warn{background:var(--warn-bg);border-color:var(--warn-line);color:#a8630a;}
.hint.ok{background:var(--ok-bg);border-color:var(--ok-line);color:#13803c;}
.banner{background:linear-gradient(90deg,var(--ok-bg),#fff 70%);border:1px solid var(--ok-line);
  border-left:4px solid var(--ok);border-radius:var(--r);padding:18px 22px;margin-bottom:18px;}
.banner .bt{font-size:15.5px;font-weight:700;color:#13803c;margin-bottom:11px;letter-spacing:-.01em;}
.toast{position:fixed;bottom:22px;right:22px;background:var(--chrome);color:#eef2fb;padding:13px 17px;
  border-radius:10px;font-size:13.5px;z-index:999;border-left:3px solid var(--brand);
  box-shadow:0 12px 32px rgba(26,34,51,.3);max-width:min(430px,90vw);line-height:1.5;}

/* ---------- modales ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(26,34,51,.45);display:flex;align-items:flex-start;
  justify-content:center;z-index:400;padding:44px 16px;overflow:auto;}
.modal{background:var(--surface);border-radius:14px;width:780px;max-width:96vw;padding:26px 28px 22px;
  box-shadow:0 24px 64px rgba(20,28,48,.28);}
.modal.wide{width:1060px;} .modal.narrow{width:490px;}
.modal h3{margin:0;font-size:19px;font-weight:700;color:var(--ink);letter-spacing:-.02em;}
.modal .sub{font-size:13.5px;color:var(--muted);margin:5px 0 22px;}
.m-act{display:flex;justify-content:flex-end;gap:9px;margin-top:24px;padding-top:19px;
  border-top:1px solid var(--line);flex-wrap:wrap;}

/* ---------- documentos ---------- */
.doc-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:17px 24px;
  margin-bottom:20px;padding-bottom:19px;border-bottom:1px solid var(--line);}
.doc-k{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px;}
.doc-v{font-size:14.5px;color:var(--ink);font-weight:600;}
.tl-item{font-size:13.5px;color:var(--ink-2);border-left:2px solid var(--line-2);padding:6px 0 6px 14px;margin:0 0 4px;}
.tl-item b{color:var(--ink);font-weight:600;}
.tl-item .w{color:var(--faint);font-size:12.5px;}

/* ---------- gráficas ---------- */
.dash-head{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;
  padding:20px 24px;background:linear-gradient(115deg,var(--chrome),#2e3f6d);border-radius:var(--r);
  margin-bottom:18px;color:#fff;}
.dash-head .dh-t{font-size:17px;font-weight:700;letter-spacing:-.01em;}
.dash-head .dh-s{font-size:13px;color:#a8b5d4;margin-top:3px;}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-bottom:18px;}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:19px 21px 15px;box-shadow:0 1px 2px rgba(26,34,51,.04);}
.cc-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:18px;
  padding-bottom:12px;border-bottom:1px solid var(--line);}
.cc-t{font-weight:700;color:var(--ink);font-size:15px;letter-spacing:-.01em;}
.cc-u{font-size:11.5px;color:var(--faint);font-weight:500;}
.brow{margin-bottom:13px;} .brow:last-child{margin-bottom:4px;}
.brow-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px;}
.brow-name{font-size:13.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  display:flex;align-items:baseline;font-weight:500;}
.brow-val{font-family:var(--mono);font-weight:500;font-size:13px;color:var(--ink);flex:none;
  font-variant-numeric:tabular-nums;}
.brow-val small{color:var(--faint);margin-left:5px;}
.btrack{height:7px;background:var(--surface-2);border-radius:999px;overflow:hidden;}
.bfill{height:100%;background:var(--brand);border-radius:999px;min-width:3px;transition:width .35s ease;}
.rank{display:inline-block;width:17px;color:var(--faint);font-size:11.5px;font-weight:600;flex:none;}
.cols{display:flex;align-items:flex-end;gap:11px;height:176px;padding-top:6px;}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;min-width:0;}
.col .cbar{width:100%;max-width:48px;background:linear-gradient(180deg,#4b6ce0,var(--brand));
  border-radius:6px 6px 2px 2px;min-height:3px;transition:height .35s ease;}
.col .cval{font-size:11.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;}
.col .clab{font-size:11.5px;color:var(--muted);white-space:nowrap;}
/* tonos por gráfica y por familia del catálogo */
.t1 .bfill,.t1 .cbar{background:var(--c1);} .t2 .bfill{background:var(--c2);}
.t3 .bfill{background:var(--c3);} .t4 .bfill{background:var(--c4);}
.t5 .bfill{background:var(--c5);} .t6 .bfill{background:var(--c6);}
.t7 .bfill{background:var(--c7);} .t8 .bfill{background:var(--c8);}

@media(max-width:820px){
  .grid2,.grid3{grid-template-columns:1fr;}
  .wrap{padding:0 14px 48px;} .tabs{margin:0 -14px 18px;padding:0 14px;}
  .hdr{padding:12px 14px;height:auto;} .kpi{min-width:145px;}
  .tbl-scroll{margin:0 -16px;padding:0 16px;}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* Catalogo MRO — extraido de "Control de Inventario - MRO 2022-24" (Google Sheets, fmorales@rubber-mexico.com)

<script>
const {createElement: h, useState, useEffect, useMemo, Fragment} = React;

/* ================= quién entra =================
   Entrada con la cuenta de Google de la empresa. No hay contraseñas aquí:
   Google devuelve un JWT firmado, el backend lo verifica y saca de ahí el
   correo. Sólo pasan las cuentas del dominio de la empresa.            */
const DOMINIO = (window.MRO_DOMINIO || 'rubber-mexico.com').toLowerCase();

function leerJwt(t){
  try{
    const base = t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    return JSON.parse(decodeURIComponent(atob(base).split('').map(
      c => '%' + ('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')));
  }catch(e){ return null; }
}

const SESION = (function(){
  let cred = null, perfil = null;
  const K = 'mro_sol_cred';
  try{
    const g = localStorage.getItem(K);
    if(g){ const p = leerJwt(g); if(p && p.exp*1000 > Date.now()){ cred = g; perfil = p; } }
    if(!perfil){
      const d = localStorage.getItem(K+'_dec');
      if(d){ const p = JSON.parse(d); if(p && p.exp*1000 > Date.now()) perfil = p; }
    }
  }catch(e){}
  return {
    get token(){ return cred; },
    get perfil(){ return perfil; },
    get valido(){ return !!(perfil && perfil.exp*1000 > Date.now()); },
    entrar(credential){
      const p = leerJwt(credential);
      if(!p) return {ok:false, error:'No pude leer la respuesta de Google.'};
      const correo = (p.email||'').toLowerCase();
      const dominio = (p.hd||'').toLowerCase() || correo.split('@')[1] || '';
      if(dominio !== DOMINIO)
        return {ok:false, error:'Entra con tu cuenta @'+DOMINIO+'. Esa ('+correo+') es de otro dominio.'};
      if(p.email_verified === false)
        return {ok:false, error:'Google marca ese correo como no verificado.'};
      cred = credential; perfil = p;
      try{ localStorage.setItem(K, credential); }catch(e){}
      return {ok:true};
    },
    /* Sin Google: la persona declara su correo. No está verificado y así se
       guarda, para no hacerlo pasar por lo que no es. */
    entrarConCorreo(correo, nombre){
      const dom = (correo.split('@')[1]||'').toLowerCase();
      if(dom !== DOMINIO) return {ok:false, error:'Tiene que ser un correo @'+DOMINIO+'.'};
      cred = null;
      perfil = {email:correo, name:nombre||correo, declarado:true,
                exp: Math.floor(Date.now()/1000) + 60*60*12};
      try{ localStorage.setItem(K+'_dec', JSON.stringify(perfil)); }catch(e){}
      return {ok:true};
    },
    salir(){ cred = null; perfil = null;
      try{ localStorage.removeItem(K); localStorage.removeItem(K+'_dec'); }catch(e){} }
  };
})();

/* ================= a dónde van las solicitudes =================
   Al mismo backend del portal de compras, para que le caigan al almacén en
   su bandeja. El token de Google viaja en el cuerpo y el Lambda lo verifica. */
const ENVIO = (function(){
  const API = (window.MRO_API_BASE || '').replace(/\/+$/,'');
  async function llamar(action, extra){
    if(!API) throw new Error('sin API');
    /* El API del CNC exige su llave en cada llamada. No es un secreto: es
       una llave de cuota, la misma que ya viaja en el resto de las paginas
       del portal. Quien decide quien eres es el servidor, no esta llave. */
    const h = {'Content-Type':'application/json'};
    if(window.MRO_API_KEY) h['x-api-key'] = window.MRO_API_KEY;
    const r = await fetch(API + '/mro-publico', {
      method: 'POST',
      headers: h,
      body: JSON.stringify(Object.assign({action, google_token: SESION.token,
        correo_declarado: SESION.token ? null : (SESION.perfil||{}).email,
        nombre_declarado: SESION.token ? null : (SESION.perfil||{}).name}, extra||{}))
    });

/* consumo mensual real: promedio de salidas de los últimos N meses cerrados */
function consumoMensual(movs, cod, meses){
  const fin = new Date(); fin.setDate(1);
  const ini = new Date(fin); ini.setMonth(ini.getMonth()-meses);
  let tot=0;
  movs.forEach(m=>{ if(m.c===cod && m.t==="S"){ const d=new Date(m.f+"T12:00:00");
    if(d>=ini && d<fin) tot += Math.abs(m.q); } });
  return tot/meses;
}
/* Techo de sensatez: en el sheet original hay mínimos y "min order qty" que vienen
   en otra unidad (p.ej. 37,044 ROLLO). Si un parámetro pide más de un año de consumo
   sobre el mínimo, se ignora y la parte se marca como dato dudoso. */
function techo(it, cm){ return Math.max((it.mn||0), cm*12, 10) * 1.5; }
function anomalias(it, cm){
  const t = techo(it,cm), a = [];
  if((it.s||0) < 0) a.push("stock negativo");
  if(it.mo && it.mo > t) a.push("cant. mínima de orden fuera de escala");
  if(it.mu > 1 && it.mu > t) a.push("múltiplo de compra fuera de escala");
  if(it.mn > 0 && cm === 0 && it.mn > 500) a.push("mínimo alto sin consumo");
  return a;
}
/* cantidad sugerida a ordenar: cubrir lead time + colchón, respetando mín y múltiplos */
function sugerido(it, cm, colchon){
  const t = techo(it,cm);
  const objetivo = cm * ((Number(it.lt)||1) + colchon);
  let s = Math.max(0, Math.ceil(objetivo - (it.s||0)));
  if(it.mn && (it.s||0) < it.mn) s = Math.max(s, it.mn - (it.s||0));
  if(s>0 && it.mo && it.mo<=t) s = Math.max(s, it.mo);
  if(s>0 && it.mu>1 && it.mu<=t) s = Math.ceil(s/it.mu)*it.mu;
  return s;
}
async function csvDownload(nombre, filas){
  const esc = v => { const s = v==null?"":String(v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const txt = "﻿"+filas.map(f=>f.map(esc).join(",")).join("\r\n");
  let dl = null;
  try{ dl = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null; }catch(e){}
  if(dl){ try{ await dl.save({filename:nombre, data:txt}); }catch(e){} return; }
  const url = URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));
  const a = document.createElement("a"); a.href=url; a.download=nombre; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

/* ================= almacén compartido =================
   Este sitio no administra inventario: sólo manda solicitudes y lee las
   propias. Todo pasa por el backend del portal de compras.             */
const STORE = (function(){
  const cache = {solicitudes: []};
  const subs = {};
  let modo = "local";
  const lk = 'mro_sol_local';
  const leerLocal = () => { try{ return JSON.parse(localStorage.getItem(lk)||'[]'); }catch(e){ return []; } };
  const guardarLocal = v => { try{ localStorage.setItem(lk, JSON.stringify(v)); }catch(e){} };
  const avisar = () => (subs.solicitudes||[]).forEach(cb=>cb(cache.solicitudes.slice()));

  return {
    get compartido(){ return modo === "api"; },
    get modo(){ return modo; },
    async init(){
      if(!ENVIO.configurado || !SESION.valido){ modo = "local"; cache.solicitudes = leerLocal(); return false; }
      try{ cache.solicitudes = await ENVIO.listar(); modo = "api"; }
      catch(e){ modo = "local"; cache.solicitudes = leerLocal(); }
      avisar();
      return modo === "api";
    },
    watch(c, cb){
      if(c !== "solicitudes"){ cb([]); return ()=>{}; }
      (subs.solicitudes = subs.solicitudes||[]).push(cb);
      cb(cache.solicitudes.slice());
      let vivo = true, t = null;
      if(modo === "api"){
        const traer = () => ENVIO.listar().then(v=>{ if(vivo){ cache.solicitudes = v; avisar(); } }).catch(()=>{});
        t = setInterval(traer, 15000);
        document.addEventListener("visibilitychange", traer);
      }
      return ()=>{ vivo = false; if(t) clearInterval(t);
                   subs.solicitudes = (subs.solicitudes||[]).filter(f=>f!==cb); };
    },
    async put(c, id, obj){
      if(c !== "solicitudes") return true;
      const doc = Object.assign({}, obj, {id});
      if(modo === "api"){
        try{
          const guardada = doc.est === "RECOGIDA" ? (await ENVIO.confirmar(id), doc) : await ENVIO.crear(doc);
          cache.solicitudes = cache.solicitudes.filter(x=>x.id!==id).concat([guardada || doc]);
          avisar(); return true;
        }catch(e){ return false; }
      }
      cache.solicitudes = cache.solicitudes.filter(x=>x.id!==id).concat([doc]);
      guardarLocal(cache.solicitudes); avisar(); return true;
    },
    async del(){ return true; }
  };
})();

/* Historial de EJEMPLO. El sheet real no se pudo exportar completo, así que los
   movimientos son simulados para poder ver reportes; el catálogo sí es real.
   Los movimientos demo llevan dem:true y NO afectan el stock del catálogo.   */
function movsDemo(items){
  let s = 20260908;
  const R = () => { s = (s*1664525+1013904223) >>> 0; return s/4294967296; };
  const pick = a => a[Math.floor(R()*a.length)];
  const cand = items.filter(i => (i.cm||0) > 0 || i.s > 0);
  const movs = [];
  const hoyD = new Date();
  for(let d=240; d>=0; d--){
    const day = new Date(hoyD); day.setDate(day.getDate()-d);
    if(day.getDay()===0) continue;
    const fecha = day.toISOString().slice(0,10);
    const n = Math.floor(R()*4);
    for(let j=0;j<n;j++){
      const it = pick(cand); if(!it) continue;
      const base = Math.max(1, Math.round((it.cm||2)/4));
      movs.push({id:uid(), f:fecha, c:it.c, u:it.u, t:"S", q:-(1+Math.floor(R()*base)),
        area:pick(AREAS), req:pick(REQUISITORES), proy:pick(PROYECTOS), maq:R()<.45?"MAQ "+(1+Math.floor(R()*12)):"",
        mot:pick(MOTIVOS), oc:"", fac:"", nota:"", por:pick(REQUISITORES), dem:true});
    }
    if(R()<0.22){
      const it = pick(cand); if(!it) continue;
      movs.push({id:uid(), f:fecha, c:it.c, u:it.u, t:"E", q:1+Math.floor(R()*(it.mo||20)),
        area:"Almacén MP", req:"", proy:"", maq:"", mot:"Recepción de compra",
        oc:"OC-"+(10000+Math.floor(R()*8000)), fac:"F-"+(1000+Math.floor(R()*9000)), nota:"", por:"Almacén MRO", dem:true});
    }
  }
  return movs.sort((a,b)=> a.f<b.f?1:-1);
}

    sol.nota ? h("div",{className:"hint"+(sol.urg&&sol.urg!==URGENCIAS[0]?" warn":"")},
      h("b",null, sol.urg&&sol.urg!==URGENCIAS[0] ? "Línea o máquina detenida — " : "Comentario — "), sol.nota) : null,

          esMRO ? h("th",{className:"num"},"Existencia") : null,

/* ================= pestaña: Reportes ================= */
function Reportes({items,movs}){
  const [rango,setRango]=useState(6);
  const desde = (()=>{ const d=new Date(); d.setMonth(d.getMonth()-rango); return d.toISOString().slice(0,10); })();
  const sal = movs.filter(m=>m.t==="S" && m.f>=desde);
  const idx={}; items.forEach(i=>idx[i.c]=i);
  const agrupar = (campo, top) => {
    const acc={};
    sal.forEach(m=>{ const k = campo==="fam" ? clasFam((idx[m.c]||{}).k) : (m[campo]||"Sin dato");
      acc[k]=(acc[k]||0)+Math.abs(m.q); });
    return Object.keys(acc).map(k=>({n:k,v:acc[k]})).sort((a,b)=>b.v-a.v).slice(0,top||10);
  };
  const rot = items.map(i=>{ const cm=consumoMensual(movs,i.c,rango);
      return {n:i.c+" · "+(i.d||"").slice(0,32), v: i.s>0 ? +(cm*12/i.s).toFixed(1) : 0, sub:" vueltas/año"}; })
    .filter(r=>r.v>0).sort((a,b)=>b.v-a.v).slice(0,10);
  const lentos = items.filter(i=>i.s>0 && consumoMensual(movs,i.c,rango)===0)
    .map(i=>({n:i.c+" · "+(i.d||"").slice(0,32), v:i.s})).sort((a,b)=>b.v-a.v).slice(0,10);
  return h("div",null,
    h("div",{className:"dash-head"},
      h("div",null,h("div",{className:"dh-t"},"Reportes de consumo"),
        h("div",{className:"dh-s"},nf(sal.length)+" salidas analizadas desde "+fdate(desde))),
      h("div",{className:"seg on-dark"},[3,6,12,24].map(v=>
        h("button",{key:v,className:rango===v?"active":"",onClick:()=>setRango(v)},v+" meses")))),
    h("div",{className:"chart-grid"},
      h(BarChart,{title:"Consumo por área",unit:"unidades",rows:agrupar("area"),tono:1}),
      h(BarChart,{title:"Consumo por requisitor",unit:"unidades",rows:agrupar("req"),tono:2}),
      h(BarChart,{title:"Consumo por máquina",unit:"unidades",rows:agrupar("maq"),tono:3}),
      h(BarChart,{title:"Consumo por proyecto",unit:"unidades",rows:agrupar("proy"),tono:8}),
      h(BarChart,{title:"Consumo por familia",unit:"unidades",rows:agrupar("fam"),tono:6}),
      h(BarChart,{title:"Motivo de salida",unit:"unidades",rows:agrupar("mot"),tono:5}),
      h(BarChart,{title:"Mayor rotación",unit:"vueltas al año",rows:rot,fmt:v=>nf1(v),tono:4}),
      h(BarChart,{title:"Sin movimiento en el periodo",unit:"stock detenido",rows:lentos,tono:7})));
}

/* ================= App ================= */
/* Botón oficial de Google. Se dibuja cuando la librería ya cargó. */
function BotonGoogle({onCredential, onError}){
  const caja = React.useRef(null);
  useEffect(()=>{
    let cancelado = false;
    const intentar = () => {
      if(cancelado) return;
      const g = window.google && window.google.accounts && window.google.accounts.id;
      if(!g || !caja.current){ setTimeout(intentar, 300); return; }
      if(!window.MRO_GOOGLE_CLIENT_ID){ onError('Falta configurar el Client ID de Google en config.js.'); return; }
      try{
        g.initialize({
          client_id: window.MRO_GOOGLE_CLIENT_ID,
          hd: (window.MRO_DOMINIO || 'rubber-mexico.com'),
          callback: r => onCredential(r.credential)
        });
        g.renderButton(caja.current, {theme:'outline', size:'large', text:'signin_with',
                                      shape:'rectangular', locale:'es', width:280});
      }catch(e){ onError('No pude iniciar el acceso con Google: '+(e.message||e)); }
    };
    intentar();
    return ()=>{ cancelado = true; };
  },[]);
  return h("div",{ref:caja, style:{display:"flex", justifyContent:"center", minHeight:44}});
}

function Entrada({onEntrar}){
  const [error,setError] = useState("");
  const [correo,setCorreo] = useState("");
  const [nombre,setNombre] = useState("");
  const dominio = window.MRO_DOMINIO || 'rubber-mexico.com';
  const conGoogle = !!window.MRO_GOOGLE_CLIENT_ID;
  const correoOk = new RegExp("^[^@\\s]+@" + dominio.replace(/\./g,"\\.") + "$","i").test(correo.trim());
  const puede = correoOk && nombre.trim();

  return h("div",{className:"wrap",style:{maxWidth:520, paddingTop:56}},
    h("div",{className:"panel",style:{padding:"36px 32px"}},
      h("div",{style:{fontSize:26,fontWeight:700,letterSpacing:"-.02em",color:"var(--ink)",textAlign:"center"}},
        "Solicitud de material"),
      h("div",{className:"muted",style:{marginTop:8,marginBottom:28,fontSize:14.5,textAlign:"center"}},
        "Pide lo que necesitas al almacén MRO. Entra con tu correo ",
        h("b",null,"@"+dominio),"."),

      conGoogle
        ? h(Fragment,null,
            h(BotonGoogle,{onCredential:c=>{
                const r = SESION.entrar(c);
                if(r.ok){ setError(""); onEntrar(); } else setError(r.error);
              }, onError:setError}))
        /* Sin el acceso de Google configurado, se entra escribiendo el correo.
           Queda marcado como no verificado para que el almacén lo sepa.      */
        : h(Fragment,null,
            h(Field,{label:"Tu correo de la empresa"},
              h("input",{className:"form-control",type:"email",value:correo,autoFocus:true,
                placeholder:"nombre@"+dominio,
                onChange:e=>{ setCorreo(e.target.value); setError(""); }})),
            h(Field,{label:"Tu nombre"},
              h("input",{className:"form-control",value:nombre,placeholder:"Nombre y apellido",
                onChange:e=>setNombre(e.target.value)})),
            correo.trim() && !correoOk
              ? h("div",{className:"hint warn"},"Tiene que ser un correo @"+dominio+".") : null,
            h("button",{className:"btn btn-primary",style:{width:"100%",height:42},disabled:!puede,
              onClick:()=>{
                const r = SESION.entrarConCorreo(correo.trim().toLowerCase(), nombre.trim());
                if(r.ok){ setError(""); onEntrar(); } else setError(r.error);
              }}, "Entrar")),

      error ? h("div",{className:"hint warn",style:{marginTop:22}},error) : null,
      h("div",{className:"muted",style:{marginTop:26,fontSize:12.5,textAlign:"center"}},
        conGoogle
          ? "Tu nombre y tu correo salen de Google; no se captura ninguna contraseña aquí."
          : "No se pide contraseña. Tu correo queda en la solicitud para que el almacén sepa a quién avisarle.")));
}

function App(){
  const [sesion,setSesion]   = useState(()=>SESION.valido);
  const [sols,setSols]       = useState([]);
  const [compartido,setComp] = useState(false);
  const [vista,setVista]     = useState("mis");
  const [modal,setModal]     = useState(null);
  const [toast,setToast]     = useState("");
  const [items]              = useState(()=>SEED_ITEMS.map(o=>Object.assign({},o)));
  const [area,setArea]       = useState(()=>{ try{ return localStorage.getItem("mro_sol_area")||""; }catch(e){ return ""; } });

  useEffect(()=>{ if(!sesion) return; let offs=[];
    (async()=>{
      setComp(await STORE.init());
      offs.push(STORE.watch("solicitudes", r=>setSols(r)));
    })();
    return ()=>offs.forEach(f=>{ try{ f&&f(); }catch(e){} });
  },[sesion]);
  useEffect(()=>{ try{ localStorage.setItem("mro_sol_area", area); }catch(e){} },[area]);
  useEffect(()=>{ if(!toast) return; const t=setTimeout(()=>setToast(""),4200); return ()=>clearTimeout(t); },[toast]);

  if(!sesion) return h(Fragment,null,
    h("div",{className:"hdr"},
      h("div",{className:"brand"},h("div",{className:"logo"},"MRO"),
        h("div",null,h("div",{className:"t"},"Solicitud de material"),
          h("div",{className:"s"},"RUBBER MEXICO · ALMACÉN MRO")))),
    h(Entrada,{onEntrar:()=>setSesion(true)}));

  const perfil = SESION.perfil || {};
  const yo = { nombre: perfil.name || perfil.email || "", area, rol: "SOL" };
  const misListas = sols.filter(s=>s.est==="SURTIDA").length;

  const crearSol = async s => {
    const folio = "SOL-"+String(Date.now()).slice(-6);
    if(s.sol && s.sol.area) setArea(s.sol.area);
    const ok = await STORE.put("solicitudes", s.id, Object.assign({}, s, {folio, correo: perfil.email}));
    setModal(null);
    setToast(ok ? "Solicitud enviada al almacén. Te avisamos aquí cuando esté lista."
                : "No se pudo enviar. Revisa tu conexión e inténtalo otra vez.");
  };
  const confirmarRecibo = async s => {
    await STORE.put("solicitudes", s.id, Object.assign({},s,{est:"RECOGIDA",
      hist:(s.hist||[]).concat([sello("RECOGIDA", yo.nombre, "confirmó de recibido")])}));
    setToast("Gracias, queda registrado que ya lo recogiste.");
  };

  return h(Fragment,null,
    h("div",{className:"hdr"},
      h("div",{className:"brand"},h("div",{className:"logo"},"MRO"),
        h("div",null,h("div",{className:"t"},"Solicitud de material"),
          h("div",{className:"s"},"RUBBER MEXICO · ALMACÉN MRO"))),
      h("div",{className:"hdr-r"},
        h("span",{className:"conn"+(compartido?" on":"")}, compartido ? "En línea" : "Sin conexión al almacén"),
        h("button",{className:"btn btn-sm",title:perfil.email||"",
          onClick:()=>{ SESION.salir(); setSesion(false); }}, (perfil.name||perfil.email||"")+" · Salir"))),
    h("div",{className:"wrap"},
      h("div",{className:"tabs"},
        [["mis","Mis solicitudes"],["cat","Qué puedo pedir"]].map(t=>
          h("button",{key:t[0],className:"tab"+(vista===t[0]?" active":""),onClick:()=>setVista(t[0])}, t[1],
            t[0]==="mis"&&misListas ? h("span",{className:"bdg"},misListas) : null))),
      !compartido ? h("div",{className:"hint warn"},
        h("b",null,"Todavía no está conectado al almacén. "),
        "Lo que captures aquí no le llega a MRO. Falta publicar el backend (ver README).") : null,
      vista==="mis" ? h(MisSolicitudes,{sols,yo,onNueva:()=>setModal({k:"nueva"}),
        onOpen:s=>setModal({k:"sol",sol:s}), onConfirmar:confirmarRecibo}) : null,
      vista==="cat" ? h(Inventario,{items,movs:[],onOpen:i=>setModal({k:"item",it:i}),onMov:null}) : null),
    modal&&modal.k==="nueva" ? h(NuevaSolicitudModal,{items,yo,onSave:crearSol,onClose:()=>setModal(null)}) : null,
    modal&&modal.k==="sol" ? h(SolicitudDetalle,{sol:sols.find(s=>s.id===modal.sol.id)||modal.sol,
      items,yo,onUpd:()=>{},onSurtir:()=>{},onClose:()=>setModal(null)}) : null,
    modal&&modal.k==="item" ? h(ItemModal,{it:modal.it,movs:[],onSave:()=>{},onMov:null,
      onClose:()=>setModal(null)}) : null,
    h("datalist",{id:"dl-items"}, items.slice(0,900).map(i=>h("option",{key:i.c,value:i.c},i.d))),
    h("datalist",{id:"dl-lider"}, []),
    toast ? h("div",{className:"toast"},toast) : null);
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
